M(`<div class="tile t-${a.cat}" style="height:160px"><span>${ini(a.name)}</span></div><span class="lbl">${CAT[a.cat].toUpperCase()}</span><h1 style="font-size:22px">${a.name}</h1><div class="mut" style="margin-bottom:10px">${a.desc}</div><div class="kv"><span class="mut">Purchase price</span><b>${f0(a.price)}</b></div><div class="kv"><span class="mut">Current estimated value</span><b>${f0(v)}</b></div><div class="kv"><span class="mut">Daily / monthly / annual income</span><b>${a.inc?f0(a.inc)+' / '+f0(a.inc*30)+' / '+f0(a.inc*365):'None (appreciation only)'}</b></div><div class="kv"><span class="mut">Your cash</span><b>${f2(S.cash)}</b></div>${o?`<div class="kv"><span class="mut">Proceeds if sold (${+(sellR()*100).toFixed(2)}% fee)</span><b>${f2(v*(1-sellR()))}</b></div>`:`<div class="kv"><span class="mut">Cash after purchase</span><b class="${af?'':'dn'}">${f2(S.cash-a.price)}</b></div>`}${!af&&!o?'<div class="err">Not enough cash. You need '+f0(a.price-S.cash)+' more.</div>':''}<div class="row" style="margin-top:16px"><button class="btn" data-a="cl2">Close</button>${o?`<button class="btn pri" data-a="sell" data-id="${id}">Sell asset</button>`:`<button class="btn pri" data-a="buy" data-id="${id}" ${af?'':'disabled'}>Confirm purchase</button>`}</div>`)}
function tradeBody(t){const k=K.find(x=>x.t===t),p=S.px[t],l=p[p.length-1],n={live:40,ses:150,all:999}[ui.cr],v=p.slice(-n),dc=(l/S.open[t]-1)*100,rh=Math.max(...p.slice(-60)),dr=(l/rh-1)*100,rt=[];
for(let i=Math.max(1,p.length-40);i<p.length;i++)rt.push(p[i]/p[i-1]-1);const m=rt.reduce((a,b)=>a+b,0)/rt.length,vo=Math.sqrt(rt.reduce((a,b)=>a+(b-m)**2,0)/rt.length)*100,o=S.sh[t],c=dc>=0?'#00C985':'#D2605F';
const kv=(a,b)=>`<div class="kv"><span class="mut">${a}</span><b>${b}</b></div>`;
return `<div class="row" style="align-items:flex-end"><div class="md">${f2(l)} <span class="${dc>=0?'up':'dn'}" style="font-size:14px">${pc(dc)} today</span></div><span class="rg">${[['live','Live'],['ses','Session'],['all','All']].map(x=>`<button class="${ui.cr===x[0]?'on':''}" data-a="cr" data-id="${x[0]}">${x[1]}</button>`).join('')}</span></div><div style="margin:10px 0 2px">${line(v,160,c)}</div><div class="row mut"><span>Low ${f2(Math.min(...v))}</span><span>High ${f2(Math.max(...v))}</span></div>
<div class="sg" style="margin-top:10px">${kv('Day open',f2(S.open[t]))}${kv('Day high / low',f2(S.hi[t])+' / '+f2(S.lo[t]))}${kv('Recent high',f2(rh))}${kv('Drop from high','<span class="'+(dr<-5?'dn':'')+'">'+pc(dr)+'</span>')}${kv('Volatility',vo.toFixed(2)+'%')}${kv('Volume today',(S.vol[t]/1000).toFixed(0)+'K')}${kv('Market cap','$'+(l*k.sh/1000).toFixed(1)+'B')}${kv('Dividend yield',k.y+'% a year')}${kv('Shares owned',o?o.n:0)}${kv('Your P/L',o?'<span class="'+(o.n*l-o.cost>=0?'up':'dn')+'">'+f2(o.n*l-o.cost)+'</span>':'–')}</div>`}
function trade(t,msg){ui.mt=t;const k=K.find(x=>x.t===t);M(`<span class="lbl">${k.s.toUpperCase()}</span><h1 style="font-size:22px;margin-bottom:6px">${t} · ${k.n}</h1><div id="tb">${tradeBody(t)}</div><div class="kv"><span class="mut">Available cash</span><b>${f2(S.cash)}</b></div><div class="row" style="margin-top:14px;align-items:center"><span class="mut">Shares (${+(feeR()*100).toFixed(2)}% fee per trade)</span><input id="qty" type="number" min="1" value="1" style="width:100px"></div>${msg?`<div class="err">${msg}</div>`:''}<div class="row" style="margin-top:16px"><button class="btn" data-a="cl2">Close</button><span><button class="btn" data-a="tsell" data-id="${t}">Sell</button> <button class="btn pri" data-a="tbuy" data-id="${t}">Buy</button></span></div>`)}
const qty=()=>Math.max(1,Math.floor(+($('#qty')||{}).value||1));
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
if(a==='cl'&&e.target!==el)return;
if(a==='cl'||a==='cl2')cl();
else if(a==='nav'){cl();if(id.startsWith('m:')){const t=id.slice(2);if(t==='stk')ui.page='stk';else{ui.page='mk';ui.tab=t}}else ui.page=id;shell();render();scrollTo(0,0)}
else if(a==='tab'){ui.tab=id;shell();render()}
else if(a==='rg'){ui.range=id;render()}
else if(a==='cr'){ui.cr=id;const b=$('#tb');if(b)b.innerHTML=tradeBody(ui.mt);document.querySelectorAll('.mb .rg button').forEach(x=>x.classList.toggle('on',x.dataset.id===id))}
else if(a==='col')$('#app').classList.toggle('col')
else if(a==='pz'){paused=!paused;if(!paused){S.ts=Date.now()}upd()}
else if(a==='bell'){const f=S.feed;S.unread=0;upd();M(`<h1 style="font-size:20px;margin-bottom:10px">Alerts</h1>${f.length?f.slice(0,15).map(n=>`<div class="kv"><span>${esc(n.h)}</span><span class="mut">Day ${n.d}</span></div>`).join(''):'<div class="mut">Nothing yet. Market news, price drops and achievements will show up here.</div>'}<div class="row" style="margin-top:16px"><span></span><button class="btn" data-a="cl2">Close</button></div>`)}
else if(a==='gsign')gSign()
else if(a==='glog')gLog()
else if(a==='gcont')gEnter()
else if(a==='gforgot')gForgot()
else if(a==='gout')gOut()
else if(a==='cvv'){ui.cvv=!ui.cvv;render()}
else if(a==='payok')payOk()
else if(a==='payno'){const b=ui.pay&&ui.pay.back;ui.pay=null;if(b)b();else cl()}
else if(a==='subpick')subAsk(id)
else if(a==='subok')subTry(id)
else if(a==='subcancel'){delete S.sub;save();render();toast('Membership cancelled')}
else if(a==='view')view(id)
else if(a==='buy'){const x=AM[id];if(S.cash<x.price||owned(id))return;pay(x.price,'Purchase · '+x.name,()=>{if(S.cash<x.price||owned(id))return;S.cash-=x.price;S.own[id]={d:S.day,cost:x.price};addTx('Purchase · '+x.name,CAT[x.cat],-x.price);chk();save();render();toast('Purchased '+x.name)},()=>view(id))}
else if(a==='sell'){const x=AM[id];if(!owned(id))return;const v=val(x),fee=v*sellR();S.cash+=v-fee;S.tot.fees+=fee;delete S.own[id];addTx('Sale · '+x.name,'Asset sale',v-fee);save();cl();render();toast('Sold '+x.name+' (fee '+f0(fee)+')')}
else if(a==='trade')trade(id)
else if(a==='tbuy'){const n=qty(),p=price(id),c=n*p*(1+feeR());if(c>S.cash)return trade(id,'Not enough cash for '+n+' shares ('+f2(c)+' with fees).');pay(c,'Stock purchase · '+n+' '+id,()=>{if(c>S.cash)return trade(id,'Not enough cash.');const o=S.sh[id]||{n:0,cost:0};o.n+=n;o.cost+=n*p;S.sh[id]=o;S.cash-=c;S.tot.fees+=n*p*feeR();addTx('Stock purchase · '+n+' '+id,'Stocks',-c);chk();save();trade(id);render()},()=>trade(id))}
else if(a==='tsell'){const n=qty(),o=S.sh[id];if(!o||n>o.n)return trade(id,'You only own '+(o?o.n:0)+' shares.');const p=price(id),c=n*p*(1-feeR());o.cost-=o.cost*n/o.n;o.n-=n;if(!o.n)delete S.sh[id];S.cash+=c;S.tot.fees+=n*p*feeR();addTx('Stock sale · '+n+' '+id,'Stocks',c);save();trade(id);render()}
else if(a==='apply'){S.job=+id;chk();save();render()}
else if(a==='dep'||a==='wd'){const x=+$('#amt').value;if(!(x>0))return toast('Enter an amount first.');if(a==='dep'){if(x>S.cash)return toast('Not enough cash.');S.cash-=x;S.sav+=x;addTx('Transfer to savings','Transfer',-x,1)}else{if(x>S.sav)return toast('Not enough in savings.');S.sav-=x;S.cash+=x;addTx('Transfer to cash','Transfer',x,1)}chk();save();render()}
else if(a==='sv'){try{localStorage.setItem(SK(id),JSON.stringify({t:Date.now(),s:S}));toast('Saved to slot '+id)}catch(x){toast('Could not save. Browser storage is unavailable.')}render()}
else if(a==='ld'){const x=slot(id);if(x){S=Object.assign(fresh(),x.s);S.ts=Date.now();save();render();toast('Loaded slot '+id)}}
else if(a==='dl'){try{localStorage.removeItem(SK(id))}catch(x){}render()}
else if(a==='ex')M(`<h1 style="font-size:20px;margin-bottom:8px">Export save</h1><div class="mut" style="margin-bottom:8px">Copy this text and keep it somewhere safe. Paste it into Import save to restore.</div><textarea readonly id="exp">${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:12px"><span></span><button class="btn" data-a="cl2">Close</button></div>`)
else if(a==='im')M(`<h1 style="font-size:20px;margin-bottom:8px">Import save</h1><textarea id="imp" placeholder="Paste exported save text here"></textarea><div id="ie" class="err"></div><div class="row" style="margin-top:12px"><button class="btn" data-a="cl2">Cancel</button><button class="btn pri" data-a="im2">Load save</button></div>`)
else if(a==='im2'){try{const x=JSON.parse($('#imp').value);if(typeof x.cash!=='number'||!x.px)throw 0;S=Object.assign(fresh(),x);S.ts=Date.now();save();cl();render();toast('Save imported')}catch(x){$('#ie').textContent='That text isn’t a valid VELTR save.'}}
else if(a==='rs')M(`<h1 style="font-size:20px">Reset account?</h1><div class="mut" style="margin:8px 0 16px">This erases your current game and restores $10,000. Your save slots are kept.</div><div class="row"><button class="btn" data-a="cl2">Cancel</button><button class="btn pri" data-a="rs2">Reset account</button></div>`)
else if(a==='rs2'){S=fresh();if(ACC)S.name=ACC.u;ui.page='dash';save();cl();shell();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='subcode')subTry(ui.sp)});
document.addEventListener('input',e=>{if(e.target.id==='cvAmt'){const b=$('#cvBody');if(b)b.innerHTML=cvRows(Math.max(0,+e.target.value||0));return}if(e.target.id==='q'){ui.q=e.target.value;if(ui.page!=='mk'){ui.page='mk';ui.tab='all';shell();render();const q=$('#q');q.focus();q.setSelectionRange(99,99)}else{const g=$('#gr');if(g)g.innerHTML=grid()}}});
document.addEventListener('change',e=>{if(e.target.id==='so'){ui.sort=e.target.value;const g=$('#gr');if(g)g.innerHTML=grid()}if(e.target.id==='nm'){S.name=e.target.value.trim()||'Investor';save();upd()}});
function live(){upd();if(ui.mt){const b=$('#tb');if(b)b.innerHTML=tradeBody(ui.mt);return}if($('#mo').innerHTML)return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;if(['dash','stk','port','stats','bank','car','rank'].includes(ui.page))render()}
setInterval(()=>{if(paused)return;pt();S.nl.push(nwf());if(S.nl.length>300)S.nl.shift();live()},PT);
setInterval(()=>{if(paused)return;step(1);live()},DAY);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(!paused){const d=Math.min(30,Math.floor((Date.now()-S.ts)/DAY));if(d>0){step(d,true);render();toast(d+' game day'+(d>1?'s':'')+' passed while you were away')}}});
addEventListener('beforeunload',save);
if(L&&L.ts){const d=Math.min(30,Math.floor((Date.now()-L.ts)/DAY));if(d>0){step(d,true);setTimeout(()=>toast('While you were away, '+d+' game day'+(d>1?'s':'')+' passed'),600)}}

/* ---- accounts, card & checkout (all local to this browser, game only) ---- */
let ACC=null;try{ACC=JSON.parse(localStorage.getItem('veltr_acct'))}catch(e){}
const rnd=n=>{const a=new Uint32Array(n);crypto.getRandomValues(a);return [...a].map(x=>x%10).join('')};
async function hashPw(p,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of salt+p)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+h}}
function newCard(){const d=new Date(),n='9'+rnd(15);return{n,c:rnd(3),e:String(d.getMonth()+1).padStart(2,'0')+'/'+String((d.getFullYear()+4)%100).padStart(2,'0')}}
const fmtN=n=>n.replace(/(.{4})(?=.)/g,'$1 ');
function cardHtml(mask){if(!ACC)return'';const c=ACC.card;return `<div class="vc"><div class="lbl">VELTR PRIVATE WEALTH</div><div class="n">${fmtN(c.n)}</div><div class="m"><div><span class="lbl">NAME</span><div>${esc(ACC.u).toUpperCase()}</div></div><div><span class="lbl">EXPIRES</span><div>${c.e}</div></div><div><span class="lbl">CVV</span><div>${mask?'•••':c.c}</div></div></div></div>`}
const gate=h=>{let g=$('#gate');if(!g){g=document.createElement('div');g.id='gate';document.body.appendChild(g)}g.innerHTML=`<div class="mb"><div class="brand" style="margin-bottom:2px">VELTR</div><div class="sub">PRIVATE WEALTH</div>${h}</div>`;const f=g.querySelector('input');if(f)f.focus()};
const WARN='<div class="mut" style="font-size:12px;margin-top:12px">Game account only. It is stored in this browser, so don’t reuse a real password. The card is an in-game card with no real-world value: never enter real card details anywhere in this game.</div>';
function gShow(){paused=true;upd();if(!ACC)gate(`<h1 style="font-size:22px;margin-bottom:6px">Create your account</h1><div class="mut" style="margin-bottom:14px">Pick a screen name and a password. You’ll get your own VELTR card.</div><span class="lbl">SCREEN NAME</span><input type="text" id="gu" maxlength="20" autocomplete="off"><span class="lbl">PASSWORD</span><input type="password" id="gp" autocomplete="new-password"><span class="lbl">CONFIRM PASSWORD</span><input type="password" id="gp2" autocomplete="new-password"><div id="ge" class="err" style="min-height:18px;margin:0 0 10px"></div><button class="btn pri" data-a="gsign" style="width:100%">Sign up</button>${WARN}`);else gate(`<h1 style="font-size:22px;margin-bottom:6px">Welcome back</h1><div class="mut" style="margin-bottom:14px">Signed in as <b>${esc(ACC.u)}</b></div><span class="lbl">PASSWORD</span><input type="password" id="gp" autocomplete="current-password"><div id="ge" class="err" style="min-height:18px;margin:0 0 10px"></div><button class="btn pri" data-a="glog" style="width:100%">Log in</button><div style="margin-top:14px"><button class="btn" data-a="gforgot">Forgot password? Erase account</button></div>${WARN}`)}
const gErr=m=>{const e=$('#ge');if(e)e.textContent=m};
async function gSign(){const u=$('#gu').value.trim(),p=$('#gp').value,p2=$('#gp2').value;if(u.length<2)return gErr('Screen name must be at least 2 characters.');if(p.length<4)return gErr('Password must be at least 4 characters.');if(p!==p2)return gErr('Passwords do not match.');const salt=rnd(12);ACC={u,salt,h:await hashPw(p,salt),card:newCard()};try{localStorage.setItem('veltr_acct',JSON.stringify(ACC))}catch(e){}S.name=u;save();sessionStorage.setItem('veltr_in','1');gate(`<h1 style="font-size:22px;margin-bottom:6px">Your VELTR card is ready</h1><div class="mut">Use these details at checkout when you buy something. You can find them again in Account &amp; Saves.</div>${cardHtml(false)}<button class="btn pri" data-a="gcont" style="width:100%">Enter VELTR</button><div class="mut" style="font-size:12px;margin-top:12px">In-game card only. It has no real-world value.</div>`)}
async function gLog(){if(await hashPw($('#gp').value,ACC.salt)!==ACC.h)return gErr('Incorrect password.');sessionStorage.setItem('veltr_in','1');gEnter()}
function gEnter(){const g=$('#gate');if(g)g.remove();paused=false;S.ts=Date.now();shell();render();upd();toast('Signed in as '+ACC.u)}
function gForgot(){if(!confirm('Erase this account and its game progress from this browser? This cannot be undone.'))return;try{localStorage.removeItem('veltr_acct');localStorage.removeItem('veltr2')}catch(e){}sessionStorage.removeItem('veltr_in');ACC=null;S=fresh();gShow()}
function gOut(){sessionStorage.removeItem('veltr_in');save();gShow()}
function pay(amt,title,ok,back){ui.pay={ok,back};M(`<span class="lbl">VELTR CARD CHECKOUT</span><h1 style="font-size:22px;margin:6px 0 10px">${title}</h1><div class="kv"><span class="mut">Total</span><b>${f2(amt)}</b></div><div class="mut" style="margin:10px 0">Enter your in-game VELTR card details (see Account &amp; Saves).</div><span class="lbl">CARD NUMBER</span><input type="text" id="ccn" inputmode="numeric" autocomplete="off" style="width:100%;margin:6px 0 10px"><div class="row"><div style="flex:1"><span class="lbl">EXPIRY (MM/YY)</span><input type="text" id="cce" autocomplete="off" placeholder="MM/YY" style="width:100%;margin-top:6px"></div><div style="flex:1"><span class="lbl">CVV</span><input type="password" id="ccv" maxlength="3" inputmode="numeric" autocomplete="off" style="width:100%;margin-top:6px"></div></div><div id="pe" class="err" style="min-height:18px"></div><div class="row" style="margin-top:12px"><button class="btn" data-a="payno">Cancel</button><button class="btn pri" data-a="payok">Pay ${f2(amt)}</button></div>`);const i=$('#ccn');if(i)i.focus()}
function payOk(){if(!ACC||!ui.pay)return;const c=ACC.card,n=$('#ccn').value.replace(/\D/g,''),e=$('#cce').value.replace(/\s/g,''),v=$('#ccv').value.trim();if(n!==c.n||e!==c.e||v!==c.c){$('#pe').textContent='These details don’t match your VELTR card.';return}const f=ui.pay.ok;ui.pay=null;cl();f()}
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;if(['gu','gp','gp2'].includes(id)){const b=document.querySelector('#gate [data-a=gsign],#gate [data-a=glog]');if(b)b.click()}else if(['ccn','cce','ccv'].includes(id))payOk()});
function gateInit(){if(ACC&&sessionStorage.getItem('veltr_in')==='1')return;gShow()}
shell();render();gateInit();
</script></body></html>
